name: Sync iptv-org lists

# iptv-org 的列表会持续变动，每 2 小时重新下载并提交，
# 服务端直连失败时可以用这里的快照兜底。
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download lists
        run: |
          set -euo pipefail
          base="https://iptv-org.github.io/iptv"
          ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          mkdir -p iptv-org
          fetch() {
            curl -fsSL --max-time 60 -A "$ua" "$base/$1" -o "iptv-org/$2"
            grep -q '#EXTM3U' "iptv-org/$2"
          }
          fetch countries/cn.m3u cn.m3u
          fetch categories/kids.m3u kids.m3u
          fetch categories/education.m3u education.m3u
          fetch categories/movies.m3u movies.m3u
          fetch categories/music.m3u music.m3u
          fetch categories/news.m3u news.m3u

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptv-org
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: sync iptv-org lists"
          git push
